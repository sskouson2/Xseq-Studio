<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XSeq Studio</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0c1017;color:#eef2f7;font-family:system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:22px}
.card{background:#171d27;border:1px solid #303949;border-radius:18px;padding:22px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:32px}
h2{font-size:19px;margin-top:0}
p{color:#aeb9c8;line-height:1.45}
label{display:block;font-weight:700;margin:18px 0 7px}
input,select,button{width:100%;box-sizing:border-box;padding:14px;border-radius:11px;border:1px solid #3d485b;background:#0f141c;color:white;font-size:16px}
button{background:#f2f5f8;color:#111827;font-weight:800;margin-top:20px}
button:disabled{opacity:.45}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#0f141c;border-radius:11px;padding:12px}
.stat small{display:block;color:#8995a6}
.stat strong{font-size:18px}
.hidden{display:none}
.good{color:#67e8a5}
#error{color:#ff8585}
#progress{margin-top:15px;color:#67e8a5}
.note{font-size:13px}
</style>
</head>
