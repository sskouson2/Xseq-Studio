<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XSeq Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f17;color:#fff;font-family:Arial,sans-serif}main{max-width:720px;margin:auto;padding:20px}.card{background:#171c28;border:1px solid #333b4c;border-radius:20px;padding:22px;margin-bottom:18px}h1{font-size:34px;margin:0 0 12px}h2{margin-top:0}p{color:#b5bdca;line-height:1.5}label{display:block;margin:17px 0 8px;font-weight:700}input,select,button{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #465064;background:#0d121b;color:#fff}button{margin-top:22px;background:#fff;color:#111;font-weight:800}button:disabled{opacity:.45}.ok{color:#67e8a5}.err{color:#ff8585}.status{margin-top:12px}.stats{background:#0d121b;padding:12px;border-radius:10px;margin-top:10px}
</style></head><body><main>
<section class="card"><h1>🎃 XSeq Studio</h1><p>Automatic xLights sequencing directly on your device.</p></section>
<section class="card"><h2>1. Your Display</h2><label>Select xlights_rgbeffects.xml</label><input id="layoutFile" type="file" accept=".xml,text/xml"><div id="layoutResult" class="status"></div></section>
<section class="card"><h2>2. Your Song</h2><label>Select MP3 or WAV</label><input id="songFile" type="file" accept=".mp3,.wav,audio/*"><div id="songResult" class="status"></div></section>
<section class="card"><h2>3. Sequence Settings</h2><label>Style</label><select id="style"><option>Halloween</option><option>Rock</option><option>Cinematic</option><option>EDM</option></select><label>Intro / Quiet Sections</label><select id="low"><option value="20">20%</option><option value="30" selected>30%</option><option value="40">40%</option></select><label>Main Sections</label><select id="mid"><option value="60">60%</option><option value="70" selected>70%</option><option value="80">80%</option></select><label>Chorus / Peak</label><select id="high"><option value="90">90%</option><option value="100" selected>100%</option></select><button id="generate" disabled>Analyze & Create Sequence</button><div id="genResult" class="status"></div></section>
<section class="card"><h2>What XSeq Studio creates</h2><p>✓ Beat timing track<br>✓ Musical-section timing track<br>✓ Dynamic prop usage<br>✓ xLights effects<br>✓ Downloadable .xsq</p></section>
</main>
<script>
"use strict";
const S={models:[],groups:[],analysis:null,audioName:""},$=id=>document.getElementById(id);
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
$("layoutFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{$("layoutResult").innerHTML="<p>Analyzing layout…</p>";const d=new DOMParser().parseFromString(await f.text(),"application/xml");if(d.querySelector("parsererror"))throw Error("Could not read this XML file.");S.models=[...d.querySelectorAll("models > model")].map(x=>x.getAttribute("name")).filter(Boolean);S.groups=[...d.querySelectorAll("modelGroups > modelGroup")].map(x=>x.getAttribute("name")).filter(Boolean);$("layoutResult").innerHTML=`<div class="stats ok"><b>✓ Layout loaded</b><br>${S.models.length} models · ${S.groups.length} groups</div>`;ready()}catch(x){$("layoutResult").innerHTML=`<p class="err">Error: ${esc(x.message)}</p>`}});
$("songFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;S.audioName=f.name;try{$("songResult").innerHTML="<p>Decoding and analyzing song…</p>";const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),a=await ctx.decodeAudioData(await f.arrayBuffer()),x=a.getChannelData(0),sr=a.sampleRate,step=Math.max(1,Math.floor(sr*.05)),env=[];for(let i=0;i<x.length;i+=step){let q=0,n=0;for(let j=i;j<Math.min(x.length,i+step);j++){q+=x[j]*x[j];n++}env.push(Math.sqrt(q/Math.max(1,n)))}const on=[0];for(let i=1;i<env.length;i++)on.push(Math.max(0,env[i]-env[i-1]));let bpm=120,bs=-1;for(let b=70;b<=180;b+=.5){const lag=Math.max(1,Math.round((60/b)/.05));let z=0;for(let i=lag;i<on.length;i++)z+=on[i]*on[i-lag];if(z>bs){bs=z;bpm=b}}let first=0,m=-1;for(let i=0;i<Math.min(100,on.length);i++)if(on[i]>m){m=on[i];first=i*.05}const beatLen=60/bpm,beats=[];for(let t=first;t<a.duration;t+=beatLen)beats.push(t);const sections=[],span=beatLen*16;for(let st=0;st<a.duration;st+=span){const en=Math.min(a.duration,st+span),aa=Math.floor(st/.05),bb=Math.min(env.length,Math.ceil(en/.05));let q=0;for(let i=aa;i<bb;i++)q+=env[i];sections.push({start:st,end:en,energy:q/Math.max(1,bb-aa)})}const vals=sections.map(s=>s.energy),lo=Math.min(...vals),hi=Math.max(...vals);sections.forEach((s,i)=>{const q=(s.energy-lo)/Math.max(.000001,hi-lo);s.level=q>=.72?"high":q>=.36?"mid":"low";s.name=s.level==="high"?"Chorus / Peak":s.level==="mid"?"Main":i===0?"Intro":"Breakdown / Quiet"});S.analysis={duration:a.duration,bpm,beats,sections};await ctx.close();$("songResult").innerHTML=`<div class="stats ok"><b>✓ Song analyzed</b><br>Length: ${fmt(a.duration)}<br>Estimated BPM: ${bpm.toFixed(1)}<br>Detected beats: ${beats.length}<br>Musical sections: ${sections.length}</div>`;ready()}catch(x){$("songResult").innerHTML=`<p class="err">Error: ${esc(x.message)}</p>`}});
function ready(){$("generate").disabled=!(S.models.length&&S.analysis)}function fmt(s){return Math.floor(s/60)+":"+Math.floor(s%60).toString().padStart(2,"0")}
function category(n){n=n.toLowerCase();if(n.includes("tv")||n.includes("matrix"))return"matrix";if(n.includes("arch"))return"arch";if(n.includes("pole"))return"pole";if(["bat","spider","pumpkin","pimp","widow"].some(x=>n.includes(x)))return"special";if(["roof","garage","window","door","icicle"].some(x=>n.includes(x)))return"outline";return"general"}function pal(cs){return cs.map((c,i)=>`C_BUTTON_Palette${i+1}=${c},C_CHECKBOX_Palette${i+1}=1`).join(",")}
$("generate").addEventListener("click",()=>{try{const A=S.analysis,low=+$("low").value,mid=+$("mid").value,high=+$("high").value,style=$("style").value,colors={Halloween:["#6A00FF","#FF5A00","#00FF66"],Rock:["#FFFFFF","#FF0000","#FFD000"],Cinematic:["#FFFFFF","#6A00FF","#00C8FF"],EDM:["#00C8FF","#6A00FF","#FFFFFF"]}[style],pref=["All House","Rooflines No Icicles","Horizontals","Verticals","Poles","Arches","Bats","Window Door and Garage"],targets=[...S.groups.filter(x=>pref.includes(x)),...S.models];let o=`<?xml version="1.0" encoding="UTF-8"?><xsequence BaseChannel="0" ChanCtrlBasic="0" ChanCtrlColor="0" FixedPointTiming="1" ModelBlending="true"><head><version>2024.13</version><author>XSeq Studio</author><sequenceTiming>25 ms</sequenceTiming><sequenceType>Media</sequenceType><mediaFile>${esc(S.audioName)}</mediaFile><sequenceDuration>${A.duration.toFixed(3)}</sequenceDuration></head><nextid>1</nextid><Jukebox/><ColorPalettes><ColorPalette>${pal(colors)}</ColorPalette></ColorPalettes><EffectDB><Effect>E_TEXTCTRL_Eff_On_Start=100,E_TEXTCTRL_Eff_On_End=100</Effect><Effect>B_CHOICE_BufferStyle=Per Model Per Preview,E_CHOICE_Bars_Direction=Alternate Right,E_SLIDER_Bars_BarCount=3</Effect><Effect>E_SLIDER_Shockwave_Cycles=1</Effect><Effect>E_CHOICE_Meteors_Effect=Down,E_SLIDER_Meteors_Count=10</Effect><Effect>E_CHOICE_Ripple_Movement=Explode,E_SLIDER_Ripple_Cycles=1</Effect></EffectDB><DataLayers/><DisplayElements>`;o+=`<Element type="timing" name="Beats" visible="1" active="1"><EffectLayer>`;A.beats.forEach((t,i)=>o+=`<Effect label="${i+1}" startTime="${Math.round(t*1000)}" endTime="${Math.round(Math.min(A.duration,t+.04)*1000)}"/>`);o+=`</EffectLayer></Element><Element type="timing" name="Song Sections" visible="1" active="1"><EffectLayer>`;A.sections.forEach(s=>{const d=s.level==="high"?high:s.level==="mid"?mid:low;o+=`<Effect label="${esc(s.name)} (${d}%)" startTime="${Math.round(s.start*1000)}" endTime="${Math.round(s.end*1000)}"/>`});o+=`</EffectLayer></Element>`;targets.forEach((n,ti)=>{o+=`<Element collapsed="0" type="model" name="${esc(n)}" visible="1"><EffectLayer>`;A.sections.forEach((s,si)=>{const d=s.level==="high"?high:s.level==="mid"?mid:low;if((ti*37+si*19)%100>=d)return;const c=category(n);let r=c==="matrix"?(s.level==="high"?3:1):c==="arch"?1:c==="pole"?(s.level==="low"?0:3):c==="special"?(s.level==="high"?4:0):c==="outline"?(s.level==="low"?0:1):s.level==="high"?2:0;o+=`<Effect ref="${r}" palette="0" startTime="${Math.round(s.start*1000)}" endTime="${Math.round(s.end*1000)}"/>`});o+=`</EffectLayer></Element>`});o+=`</DisplayElements></xsequence>`;const blob=new Blob([o],{type:"application/xml"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=S.audioName.replace(/\.[^.]+$/,"")+" - XSeq Studio.xsq";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$("genResult").innerHTML='<p class="ok"><b>✓ Sequence created and downloaded.</b></p>'}catch(x){$("genResult").innerHTML=`<p class="err">Error: ${esc(x.message)}</p>`}});
</script></body></html>
