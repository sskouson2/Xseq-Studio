<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XSeq Studio V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f17;color:#fff;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:20px}
.card{background:#171c28;border:1px solid #333b4c;border-radius:20px;padding:22px;margin-bottom:18px}h1{font-size:34px;margin:0 0 12px}h2{margin-top:0}
p{color:#b5bdca;line-height:1.5}label{display:block;margin:17px 0 8px;font-weight:700}
input,select,button{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #465064;background:#0d121b;color:#fff}
button{margin-top:14px;background:#fff;color:#111;font-weight:800}button:disabled{opacity:.45}.ok{color:#67e8a5}.err{color:#ff8585}.muted{color:#9ca8b8}
.stats{background:#0d121b;padding:12px;border-radius:10px;margin-top:10px}.hidden{display:none}
.timeline{display:flex;width:100%;height:58px;border-radius:10px;overflow:hidden;border:1px solid #465064;margin:14px 0;background:#0d121b}
.seg{min-width:3px;border-right:1px solid #0b0f17;display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden;padding:2px;text-align:center}
.low{background:#263247}.mid{background:#40506a}.high{background:#6a577b}
.section{background:#0d121b;border:1px solid #303949;border-radius:12px;padding:12px;margin:10px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.section select,.section input{padding:10px;font-size:14px}.section button{padding:10px;background:#252e3d;color:#fff}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#252e3d;color:#c9d2df;font-size:12px;margin-right:5px}.tempoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tempoGrid button{padding:10px;font-size:14px;background:#252e3d;color:#fff;margin:0}.tempoGrid button.sel{outline:2px solid #67e8a5}
</style></head>
<body><main>
<section class="card"><h1>🎃 XSeq Studio V3</h1><p>Automatic xLights sequencing directly on your device.</p></section>

<section class="card"><h2>1. Your Display</h2><label>Select xlights_rgbeffects.xml</label>
<input id="layoutFile" type="file" accept=".xml,text/xml"><div id="layoutResult"></div></section>

<section class="card"><h2>2. Your Song</h2><label>Select MP3 or WAV</label>
<input id="songFile" type="file" accept=".mp3,.wav,audio/*"><div id="songResult"></div><audio id="player" controls class="hidden" style="width:100%;margin-top:12px"></audio><div id="tempoChoices" class="hidden"></div></section>

<section id="mapCard" class="card hidden">
<h2>3. Song Map</h2>
<p class="muted">Review the detected musical regions before sequencing. Tap any label or boundary to correct it.</p>
<div id="summary"></div><div id="timeline" class="timeline"></div><div id="sections"></div>
<button id="addAtPlayhead">+ Add boundary at current playback position</button><button id="addSection">+ Enter boundary time manually</button>
</section>

<section id="settingsCard" class="card hidden">
<h2>4. Sequence Settings</h2>
<label>Style</label><select id="style"><option>Halloween</option><option>Rock</option><option>Cinematic</option><option>EDM</option></select>
<div class="row"><div><label>Quiet</label><select id="low"><option value="20">20%</option><option value="30" selected>30%</option><option value="40">40%</option></select></div>
<div><label>Main</label><select id="mid"><option value="60">60%</option><option value="70" selected>70%</option><option value="80">80%</option></select></div></div>
<label>Chorus / Peak</label><select id="high"><option value="90">90%</option><option value="100" selected>100%</option></select>
<button id="generate">Generate xLights Sequence</button><div id="genResult"></div>
</section>
</main>

<script>
"use strict";
const S={models:[],groups:[],analysis:null,audioName:""},$=id=>document.getElementById(id);
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const fmt=s=>Math.floor(s/60)+":"+Math.floor(s%60).toString().padStart(2,"0");

$("layoutFile").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const d=new DOMParser().parseFromString(await f.text(),"application/xml");if(d.querySelector("parsererror"))throw Error("Could not read this XML file.");
 S.models=[...d.querySelectorAll("models > model")].map(x=>x.getAttribute("name")).filter(Boolean);
 S.groups=[...d.querySelectorAll("modelGroups > modelGroup")].map(x=>x.getAttribute("name")).filter(Boolean);
 $("layoutResult").innerHTML=`<div class="stats ok"><b>✓ Layout loaded</b><br>${S.models.length} models · ${S.groups.length} groups</div>`}
 catch(x){$("layoutResult").innerHTML=`<p class="err">Error: ${esc(x.message)}</p>`}
});

$("songFile").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;S.audioName=f.name;if(S.audioURL)URL.revokeObjectURL(S.audioURL);S.audioURL=URL.createObjectURL(f);$("player").src=S.audioURL;$("player").classList.remove("hidden");
 try{$("songResult").innerHTML="<p>Analyzing beats, energy and musical changes…</p>";
 const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),a=await ctx.decodeAudioData(await f.arrayBuffer()),x=a.getChannelData(0),sr=a.sampleRate,dt=.05,step=Math.max(1,Math.floor(sr*dt)),env=[];
 for(let i=0;i<x.length;i+=step){let q=0,n=0;for(let j=i;j<Math.min(x.length,i+step);j++){q+=x[j]*x[j];n++}env.push(Math.sqrt(q/Math.max(1,n)))}
 const on=[0];for(let i=1;i<env.length;i++)on.push(Math.max(0,env[i]-env[i-1]));
 // tempo candidates, then prefer a musically plausible grid with strong onset alignment
 let cand=[];for(let b=60;b<=200;b+=.5){const lag=Math.max(1,Math.round((60/b)/dt));let z=0;for(let i=lag;i<on.length;i++)z+=on[i]*on[i-lag];cand.push({b,z})}
 cand.sort((a,b)=>b.z-a.z);
 const distinct=[];for(const c of cand){if(!distinct.some(d=>Math.abs(d.b-c.b)<3||Math.abs(d.b-c.b*2)<3||Math.abs(d.b-c.b/2)<3))distinct.push(c);if(distinct.length>=3)break}
 let bpm=distinct[0].b;const confidence=Math.max(0,Math.min(100,Math.round(100*(distinct[0].z-(distinct[1]?.z||0))/Math.max(.000001,distinct[0].z))));
 S.tempoCandidates=distinct.map(c=>c.b);S.tempoConfidence=confidence;
 let first=0,m=-1;for(let i=0;i<Math.min(120,on.length);i++)if(on[i]>m){m=on[i];first=i*dt}
 const beatLen=60/bpm,beats=[];for(let t=first;t<a.duration;t+=beatLen)beats.push(t);
 // 8-beat blocks; merge adjacent blocks with similar energy/role
 let blocks=[],span=beatLen*8;
 for(let st=0;st<a.duration;st+=span){const en=Math.min(a.duration,st+span),aa=Math.floor(st/dt),bb=Math.min(env.length,Math.ceil(en/dt));let q=0,tr=0;for(let i=aa;i<bb;i++){q+=env[i]||0;tr+=on[i]||0}blocks.push({start:st,end:en,energy:q/Math.max(1,bb-aa),transient:tr/Math.max(1,bb-aa)})}
 const vals=blocks.map(s=>s.energy),lo=Math.min(...vals),hi=Math.max(...vals);
 blocks.forEach((s,i)=>{s.score=(s.energy-lo)/Math.max(.000001,hi-lo);s.level=s.score>=.72?"high":s.score>=.36?"mid":"low"});
 let sections=[];for(const b of blocks){const prev=sections.at(-1);if(prev&&prev.level===b.level&&prev.end-prev.start<beatLen*24){prev.end=b.end;prev.energy=(prev.energy+b.energy)/2;prev.score=(prev.score+b.score)/2}else sections.push({...b})}
 sections.forEach((s,i)=>{if(i===0)s.name="Intro";else if(i===sections.length-1&&s.level!=="high")s.name="Outro";else if(s.level==="high")s.name="Chorus / Peak";else if(s.level==="mid"){const p=sections[i-1];s.name=p&&p.level==="low"?"Build":"Verse / Main"}else s.name="Breakdown / Quiet"});
 S.analysis={duration:a.duration,bpm,beats,sections};await ctx.close();
 $("songResult").innerHTML=`<div class="stats ok"><b>✓ Song analyzed</b><br>Length: ${fmt(a.duration)} · Estimated BPM: ${bpm.toFixed(1)} · ${beats.length} beats</div>`;
 $("tempoChoices").classList.remove("hidden");
 $("tempoChoices").innerHTML=`<p><b>Tempo candidates</b> <span class="badge">${confidence}% confidence</span></p><div class="tempoGrid">${S.tempoCandidates.map((b,i)=>`<button class="${i===0?"sel":""}" data-bpm="${b}">${b.toFixed(1)} BPM</button>`).join("")}</div><p class="muted">If the beat grid feels too slow or fast, choose another candidate. The Song Map will rebuild around it.</p>`;
 document.querySelectorAll("#tempoChoices button").forEach(btn=>btn.onclick=()=>rebuildTempo(+btn.dataset.bpm));
 $("mapCard").classList.remove("hidden");$("settingsCard").classList.remove("hidden");renderMap()}
 catch(x){$("songResult").innerHTML=`<p class="err">Error: ${esc(x.message)}</p>`}
});

function densityFor(s){return s.level==="high"?+$("high").value:s.level==="mid"?+$("mid").value:+$("low").value}
function renderMap(){
 const A=S.analysis;if(!A)return;
 $("summary").innerHTML=`<span class="badge">${fmt(A.duration)}</span><span class="badge">${A.bpm.toFixed(1)} BPM</span><span class="badge">${A.sections.length} regions</span>`;
 $("timeline").innerHTML=A.sections.map((s,i)=>`<div class="seg ${s.level}" style="width:${100*(s.end-s.start)/A.duration}%" title="${esc(s.name)} ${fmt(s.start)}–${fmt(s.end)}">${i+1}</div>`).join("");
 $("sections").innerHTML=A.sections.map((s,i)=>`<div class="section"><b>${i+1}. ${fmt(s.start)} – ${fmt(s.end)}</b>
 <div class="row"><div><label>Region</label><select data-i="${i}" class="name"><option ${s.name==="Intro"?"selected":""}>Intro</option><option ${s.name==="Verse / Main"?"selected":""}>Verse / Main</option><option ${s.name==="Build"?"selected":""}>Build</option><option ${s.name==="Chorus / Peak"?"selected":""}>Chorus / Peak</option><option ${s.name==="Breakdown / Quiet"?"selected":""}>Breakdown / Quiet</option><option ${s.name==="Outro"?"selected":""}>Outro</option></select></div>
 <div><label>End time (sec)</label><input data-i="${i}" class="end" type="number" step=".1" min="${(s.start+.1).toFixed(1)}" max="${A.duration.toFixed(1)}" value="${s.end.toFixed(1)}"></div></div>
 <p>Energy: ${Math.round(s.score*100)}% · Planned density: <b>${densityFor(s)}%</b></p></div>`).join("");
 document.querySelectorAll(".name").forEach(el=>el.onchange=e=>{const i=+e.target.dataset.i,s=A.sections[i];s.name=e.target.value;s.level=s.name==="Chorus / Peak"?"high":(s.name==="Verse / Main"||s.name==="Build")?"mid":"low";renderMap()});
 document.querySelectorAll(".end").forEach(el=>el.onchange=e=>{const i=+e.target.dataset.i,v=Math.max(A.sections[i].start+.1,Math.min(A.duration,+e.target.value));A.sections[i].end=v;if(A.sections[i+1])A.sections[i+1].start=v;renderMap()});
}
["low","mid","high"].forEach(id=>$(id).addEventListener("change",renderMap));

function splitAt(v){
 const A=S.analysis;if(!A||!(v>0&&v<A.duration))return;
 const i=A.sections.findIndex(s=>v>s.start+.15&&v<s.end-.15);if(i<0)return;
 splitAt(v);
}
function rebuildTempo(newBpm){
 const A=S.analysis;if(!A)return;
 const ratio=A.bpm/newBpm;A.bpm=newBpm;
 const first=A.beats[0]||0,beatLen=60/newBpm;A.beats=[];for(let t=first;t<A.duration;t+=beatLen)A.beats.push(t);
 document.querySelectorAll("#tempoChoices button").forEach(b=>b.classList.toggle("sel",Math.abs(+b.dataset.bpm-newBpm)<.01));
 $("songResult").innerHTML=`<div class="stats ok"><b>✓ Song analyzed</b><br>Length: ${fmt(A.duration)} · Selected BPM: ${newBpm.toFixed(1)} · ${A.beats.length} beats</div>`;
 renderMap();
}
$("addAtPlayhead").addEventListener("click",()=>splitAt($("player").currentTime));
$("addSection").addEventListener("click",()=>{const A=S.analysis;if(!A)return;const t=prompt("New boundary time in seconds:");if(t===null)return;const v=+t;if(!(v>0&&v<A.duration))return;const i=A.sections.findIndex(s=>v>s.start&&v<s.end);if(i<0)return;splitAt(v)});

function category(n){n=n.toLowerCase();if(n.includes("tv")||n.includes("matrix"))return"matrix";if(n.includes("arch"))return"arch";if(n.includes("pole"))return"pole";if(["bat","spider","pumpkin","widow"].some(x=>n.includes(x)))return"special";if(["roof","garage","window","door","icicle"].some(x=>n.includes(x)))return"outline";return"general"}
function pal(cs){return cs.map((c,i)=>`C_BUTTON_Palette${i+1}=${c},C_CHECKBOX_Palette${i+1}=1`).join(",")}
$("generate").addEventListener("click",()=>{try{
 if(!S.models.length)throw Error("Load your xlights_rgbeffects.xml first.");const A=S.analysis;if(!A)throw Error("Analyze a song first.");
 const style=$("style").value,colors={Halloween:["#6A00FF","#FF5A00","#00FF66"],Rock:["#FFFFFF","#FF0000","#FFD000"],Cinematic:["#FFFFFF","#6A00FF","#00C8FF"],EDM:["#00C8FF","#6A00FF","#FFFFFF"]}[style];
 const preferred=["All House","Rooflines No Icicles","Horizontals","Verticals","Poles","Arches","Bats","Window Door and Garage"],targets=[...S.groups.filter(x=>preferred.includes(x)),...S.models];
 let o=`<?xml version="1.0" encoding="UTF-8"?><xsequence BaseChannel="0" ChanCtrlBasic="0" ChanCtrlColor="0" FixedPointTiming="1" ModelBlending="true"><head><version>2024.13</version><author>XSeq Studio</author><sequenceTiming>25 ms</sequenceTiming><sequenceType>Media</sequenceType><mediaFile>${esc(S.audioName)}</mediaFile><sequenceDuration>${A.duration.toFixed(3)}</sequenceDuration></head><nextid>1</nextid><Jukebox/><ColorPalettes><ColorPalette>${pal(colors)}</ColorPalette></ColorPalettes><EffectDB><Effect>E_TEXTCTRL_Eff_On_Start=100,E_TEXTCTRL_Eff_On_End=100</Effect><Effect>B_CHOICE_BufferStyle=Per Model Per Preview,E_CHOICE_Bars_Direction=Alternate Right,E_SLIDER_Bars_BarCount=3</Effect><Effect>E_SLIDER_Shockwave_Cycles=1</Effect><Effect>E_CHOICE_Meteors_Effect=Down,E_SLIDER_Meteors_Count=10</Effect><Effect>E_CHOICE_Ripple_Movement=Explode,E_SLIDER_Ripple_Cycles=1</Effect></EffectDB><DataLayers/><DisplayElements>`;
 o+=`<Element type="timing" name="Beats" visible="1" active="1"><EffectLayer>`;A.beats.forEach((t,i)=>o+=`<Effect label="${i+1}" startTime="${Math.round(t*1000)}" endTime="${Math.round(Math.min(A.duration,t+.04)*1000)}"/>`);o+=`</EffectLayer></Element><Element type="timing" name="Song Map" visible="1" active="1"><EffectLayer>`;
 A.sections.forEach(s=>o+=`<Effect label="${esc(s.name)} (${densityFor(s)}%)" startTime="${Math.round(s.start*1000)}" endTime="${Math.round(s.end*1000)}"/>`);o+=`</EffectLayer></Element>`;
 targets.forEach((n,ti)=>{o+=`<Element collapsed="0" type="model" name="${esc(n)}" visible="1"><EffectLayer>`;A.sections.forEach((s,si)=>{const d=densityFor(s);if((ti*37+si*19)%100>=d)return;const c=category(n);let r=c==="matrix"?(s.level==="high"?3:1):c==="arch"?1:c==="pole"?(s.level==="low"?0:3):c==="special"?(s.level==="high"?4:0):c==="outline"?(s.level==="low"?0:1):s.level==="high"?2:0;o+=`<Effect ref="${r}" palette="0" startTime="${Math.round(s.start*1000)}" endTime="${Math.round(s.end*1000)}"/>`});o+=`</EffectLayer></Element>`});o+=`</DisplayElements></xsequence>`;
 const blob=new Blob([o],{type:"application/xml"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=S.audioName.replace(/\.[^.]+$/,"")+" - XSeq Studio.xsq";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$("genResult").innerHTML='<p class="ok"><b>✓ Sequence created and downloaded.</b></p>'
 }catch(x){$("genResult").innerHTML=`<p class="err">Error: ${esc(x.message)}</p>`}});
</script></body></html>
